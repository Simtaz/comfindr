<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>ComFindr</title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==========================
         MAIN WEBSITE
    =========================== -->

    <main class="page">


        <section class="comfindr">


            <!-- LOGO -->

            <h1 class="logo">
                ComFindr
            </h1>


            <p class="subtitle">
                Paste the Link and Find it!
            </p>



            <!-- ==========================
                 SEARCH FORM
            =========================== -->

            <form id="searchForm">


                <!-- YouTube URL -->

                <input
                    type="url"
                    id="video_url"
                    name="video_url"
                    placeholder="Enter YouTube video link"
                    autocomplete="off"
                    required
                >


                <!-- Search Word -->

                <input
                    type="text"
                    id="search_word"
                    name="search_word"
                    placeholder="Enter the word to search"
                    autocomplete="off"
                    required
                >


                <!-- Search Button -->

                <button
                    type="submit"
                    id="searchButton"
                >

                    Search

                </button>


            </form>



            <!-- ==========================
                 RESULTS
            =========================== -->

            <div
                class="results"
                id="results"
            >

                <p class="placeholder">

                    The comments related to your
                    search will appear here.

                </p>

            </div>


        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>


</body>

</html>
